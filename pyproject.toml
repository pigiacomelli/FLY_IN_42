[project]
name = "fly-in"
version = "0.1.0"
description = "Drone routing and simulation system developed for the 42 curriculum."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fly-in = "fly_in.cli:main"

[dependency-groups]
dev = [
    "flake8",
    "mypy",
    "pytest",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"